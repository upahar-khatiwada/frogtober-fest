[project]
name = "tenderly-api"
version = "0.1.0"
description = "Tenderly backend: agentic tender-to-proposal pipeline (FastAPI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "nepali-datetime>=1.0.8.5",
    "pyyaml>=6.0.3",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "sqlalchemy>=2",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "pgvector>=0.5.1",
    "python-multipart>=0.0.32",
    "beautifulsoup4>=4.15.0",
    "reportlab>=5.1,<6",
    "uharfbuzz>=0.56",
]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Real-Ollama smoke tests are opt-in: `uv run pytest -m ollama`.
addopts = "-m 'not ollama'"
markers = [
    "ollama: hits a real Ollama server at LLM_BASE_URL (skipped by default)",
]
