[project]
name = "tenderly-api"
version = "0.1.0"
description = "Tenderly backend: agentic tender-to-proposal pipeline (FastAPI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Real-Ollama smoke tests are opt-in: `uv run pytest -m ollama`.
addopts = "-m 'not ollama'"
markers = [
    "ollama: hits a real Ollama server at LLM_BASE_URL (skipped by default)",
]
