services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server components fetch from inside the compose network; the browser uses NEXT_PUBLIC_API_URL.
      API_URL: http://api:8000
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://tenderly:tenderly@db:5432/tenderly}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SEED_TENDERS_DIR: /data/seed_tenders
      SCRAPER_CONTACT: ${SCRAPER_CONTACT:-}
      # Pre-cached demo analyses (api/scripts/precache_demo.py); ignored while the file does not exist.
      LLM_REPLAY_CACHE: ${LLM_REPLAY_CACHE:-/data/demo_cache/llm_cache.json}
      # Pinned demo clock (empty = real time). Must match `precache_demo --now` for Review to replay from the cache.
      DEMO_NOW: ${DEMO_NOW:-}
    volumes:
      # Synthetic seed tenders for POST /tenders/scrape (data/ is outside the api build context).
      - ./data/seed_tenders:/data/seed_tenders:ro
      # Demo company for `docker compose exec api python -m scripts.seed_demo --data-dir /data/demo_company`.
      - ./data/demo_company:/data/demo_company:ro
      - ./data/demo_cache:/data/demo_cache:ro
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tenderly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenderly}
      POSTGRES_DB: ${POSTGRES_DB:-tenderly}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tenderly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  pgdata:
  ollama-data: